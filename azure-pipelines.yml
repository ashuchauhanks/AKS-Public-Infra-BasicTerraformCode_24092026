trigger:
  branches:
    include:
      - main
      - feature/*

parameters:
- name: environment
  displayName: 'Select Terraform Environment'
  type: string
  default: dev
  values:
    - dev
    - prod

variables:
  agentPool: 'selfhost-aks'
  azureServiceConnection: 'SVC-AZ-ARM-250926'
  terraformWorkingDirectory: 'environments/${{ parameters.environment }}'
  terraformVersion: '1.9.8'
  terraformArtifact: 'terraform-plan'

stages:

- stage: ToolSetup
  displayName: 'Tool Setup'
  jobs:
  - job: InstallTools
    displayName: 'Install Required Tools'
    pool:
      name: $(agentPool)
    steps:

    - bash: |
        if command -v az >/dev/null 2>&1; then
          echo "Azure CLI already installed."
        else
          echo "Azure CLI not found. Installing..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi

        az version
      displayName: 'Check / Install Azure CLI'

    - bash: |
        NEED_INSTALL=false

        command -v git >/dev/null 2>&1 || NEED_INSTALL=true
        command -v unzip >/dev/null 2>&1 || NEED_INSTALL=true
        python3 -c "import venv" >/dev/null 2>&1 || NEED_INSTALL=true

        if [ "$NEED_INSTALL" = true ]; then

          echo "Required packages missing."

          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
                sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
                sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "Waiting for apt/dpkg to finish..."
            sleep 5
          done

          echo "apt/dpkg is available."

          sudo apt-get update
          sudo apt-get install -y git unzip python3-venv

        else
          echo "Git, unzip and python3-venv are already installed."
        fi

        echo "Git:"
        git --version

        echo "Unzip:"
        command -v unzip
        unzip -v | head -n 1

        echo "Python:"
        python3 --version
      displayName: 'Check / Install Git, Unzip and Python'

    - task: TerraformInstaller@1
      displayName: 'Check / Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - bash: |
        if command -v tflint >/dev/null 2>&1; then
          echo "TFLint already installed."
        else
          echo "TFLint not found. Installing..."
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | sudo bash
        fi

        tflint --version
      displayName: 'Check / Install TFLint'

    - bash: |
        if [ -x /opt/checkov/bin/checkov ]; then
          echo "Checkov already installed."
        else
          echo "Checkov not found. Installing..."

          sudo python3 -m venv /opt/checkov
          sudo /opt/checkov/bin/pip install --upgrade pip
          sudo /opt/checkov/bin/pip install checkov
        fi

        sudo /opt/checkov/bin/checkov --version
      displayName: 'Check / Install Checkov'


- stage: TerraformPlan
  displayName: 'Terraform Scan Validate and Plan'
  dependsOn: ToolSetup
  condition: succeeded()
  jobs:
  - job: Plan
    displayName: 'Terraform Format Scan Validate Plan'
    pool:
      name: $(agentPool)
    steps:
    - bash: |
        cd "$(terraformWorkingDirectory)"
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    - bash: |
        cd "$(terraformWorkingDirectory)"
        tflint --init
        tflint
      displayName: 'TFLint'

    - bash: |
        /opt/checkov/bin/checkov \
          -d "$(terraformWorkingDirectory)" \
          --framework terraform
      displayName: 'Checkov Security Scan'

    # - task: InfracostSetup@2
    #   displayName: 'Install Infracost'
    #   inputs:
    #     apiKey: '$(infracostApiKey)'

    # - task: TerraformTaskV4@4
    #   displayName: 'Terraform Init'
    #   inputs:
    #     provider: 'azurerm'
    #     command: 'init'
    #     workingDirectory: '$(terraformWorkingDirectory)'
    #     backendServiceArm: '$(azureServiceConnection)'
    #     backendAzureRmResourceGroupName: 'rg-terraform-ashu'
    #     backendAzureRmStorageAccountName: 'ashustoragestate'
    #     backendAzureRmContainerName: 'tfstate'
    #     backendAzureRmKey: '${{ parameters.environment }}.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: '$(terraformArtifact)'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Apply
    displayName: 'Apply Terraform Plan'
    pool:
      name: $(agentPool)
    environment: 'terraform-${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: '$(terraformArtifact)'
              path: '$(Pipeline.Workspace)/terraform-plan'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init for Apply'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-terraform-ashu'
              backendAzureRmStorageAccountName: 'ashustoragestate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '${{ parameters.environment }}.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'