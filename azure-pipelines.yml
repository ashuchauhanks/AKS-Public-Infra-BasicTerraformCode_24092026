trigger:
  branches:
    include:
      - main
      - feature/*

parameters:
- name: environment
  displayName: 'Select Terraform Environment'
  type: string
  default: dev
  values:
    - dev
    - prod

- name: action
  displayName: 'Terraform Action'
  type: string
  default: plan
  values:
    - plan
    - apply
    - destroy

variables:
  agentPool: 'selfhost-aks'
  azureServiceConnection: 'SVC-AZ-ARM-250926'
  terraformWorkingDirectory: 'environments/${{ parameters.environment }}'
  terraformVersion: '1.9.8'
  terraformArtifact: 'terraform-plan'

stages:

- stage: ToolSetup
  displayName: 'Tool Setup'
  jobs:
  - job: InstallTools
    displayName: 'Install Required Tools'
    pool:
      name: $(agentPool)
    steps:

    - bash: |
        terraform version
        tflint --version
        checkov --version
        tfsec --version
        infracost --version
        az version


- stage: TerraformScan
  displayName: 'Terraform Security & Quality Scan'
  dependsOn: ToolSetup
  condition: succeeded()
  jobs:
  - job: Scan
    displayName: 'Terraform Scan'
    pool:
      name: $(agentPool)
    steps:

    - bash: |
        cd "$(terraformWorkingDirectory)"
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    - bash: |
        cd "$(terraformWorkingDirectory)"
        tflint --init
        tflint
      displayName: 'TFLint'

    # - bash: |
    #     checkov \
    #       -d "$(terraformWorkingDirectory)" \
    #       --framework terraform
    #   displayName: 'Checkov Security Scan'

    - bash: |
        tfsec "$(terraformWorkingDirectory)"
      displayName: 'tfsec Security Scan'

    # - task: InfracostSetup@2
    #   displayName: 'Install Infracost'
    #   inputs:
    #     apiKey: '$(infracostApiKey)'
    #     version: '0.10.x'
    #     currency: 'INR'

    # - bash: |
    #     cd "$(terraformWorkingDirectory)"
    #     infracost breakdown \
    #       --path=. \
    #       --format=table
    #   displayName: 'Infracost Cost Estimate'


- stage: TerraformPlan
  displayName: 'Terraform Validate & Plan'
  dependsOn: TerraformScan
  condition: succeeded()
  jobs:
  - job: Plan
    displayName: 'Terraform Validate & Plan'
    pool:
      name: $(agentPool)
    steps:

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'rg-terraform-ashu'
        backendAzureRmStorageAccountName: 'ashustoragestate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: '${{ parameters.environment }}.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: '$(terraformArtifact)'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.action }}', 'apply'), eq(variables['Build.Reason'], 'Manual'))

  jobs:
  - deployment: Apply
    displayName: 'Apply Terraform Plan'
    pool:
      name: $(agentPool)
    environment: 'terraform-${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: '$(terraformArtifact)'
              path: '$(Pipeline.Workspace)/terraform-plan'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init for Apply'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-terraform-ashu'
              backendAzureRmStorageAccountName: 'ashustoragestate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '${{ parameters.environment }}.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'

- stage: TerraformDestroy
  displayName: 'Terraform Destroy'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.action }}', 'destroy'), eq(variables['Build.Reason'], 'Manual'))

  jobs:
  - deployment: Destroy
    displayName: 'Destroy Terraform Infrastructure'
    pool:
      name: $(agentPool)
    environment: 'terraform-${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init for Destroy'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-terraform-ashu'
              backendAzureRmStorageAccountName: 'ashustoragestate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '${{ parameters.environment }}.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Destroy'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-auto-approve'